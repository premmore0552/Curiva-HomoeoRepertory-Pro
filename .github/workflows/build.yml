name: Build Curiva HomoeoRepertory Pro

on:
  push:
    branches: [main]
  pull_request:
    branches: [main]

permissions:
  contents: read

jobs:
  build:
    runs-on: ubuntu-latest
    steps:
      - name: Check out source
        uses: actions/checkout@v4
      - name: Set up Node.js
        uses: actions/setup-node@v4
        with:
          node-version: 22
      - name: Check Python import scripts
        run: python -m py_compile scripts/prepare-kent-pdf.py scripts/parse-kent-abbreviations.py
      - name: Test PDF import and section mapping
        run: python -m unittest discover -s tests -v
      - name: Install dependencies
        run: npm install
      - name: Type-check and build
        run: npm run build
